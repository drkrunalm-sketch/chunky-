
name: Run Fabric Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Prepare Fabric mod sources
        run: |
          mkdir -p src/main/java/com/shaurya/chunkybot
          mkdir -p src/main/resources
          cp ChunkyBotClient.java src/main/java/com/shaurya/chunkybot/ChunkyBotClient.java
          cp fabric.mod.json src/main/resources/fabric.mod.json

      - name: Verify required mods
        run: |
          echo "Checking Farmer's Delight..."
          test -f "mods/FarmersDelight-1.21.11-3.6.16+refabricated.jar"

          echo "Checking Fish of Thieves..."
          find mods -maxdepth 1 -type f -iname '*fish*of*thieves*.jar' -print -quit | grep -q .

          echo "Both required mods are present."
          echo "Total mod JARs:"
          find mods -maxdepth 1 -type f -name '*.jar' | wc -l

      - name: Build production bot JAR
        run: |
          gradle --no-daemon --console=plain build

      - name: Launch production Fabric client
        run: |
          gradle --no-daemon --console=plain prodClient --stacktrace --info
