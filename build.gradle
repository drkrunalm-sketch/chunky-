
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java'
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('maven_group') ?: 'com.shaurya.chunkybot'

base {
    archivesName = 'chunky-bot'
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty('minecraft_version') ?: '1.21.11'}"
    mappings "net.fabricmc:yarn:${project.findProperty('yarn_mappings') ?: '1.21.11+build.6'}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.findProperty('loader_version') ?: '0.19.5'}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.findProperty('fabric_version') ?: '0.141.6+1.21.11'}"
}

loom {
    mods {
        'chunky_bot' {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            name = 'Chunky Bot Development Client'
            runDir = 'run'
        }
    }
}

processResources {
    from(project.file('bot-settings.json')) {
        into ''
        rename { 'bot-settings.json' }
    }

    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('prepareBotMods', Copy) {
    from layout.projectDirectory.dir('mods')
    into layout.projectDirectory.dir('run/mods')
    include '*.jar'
    onlyIf { file('mods').exists() }
}

tasks.named('runClient') {
    dependsOn tasks.named('prepareBotMods')
    doFirst {
        def cfg = new groovy.json.JsonSlurper().parse(file('bot-settings.json'))
        def username = cfg.account.username.toString()

        if (username.length() > 16 || username.isEmpty()) {
            throw new GradleException('Invalid account.username')
        }

        def offlineUuid = UUID.nameUUIDFromBytes(
            ('OfflinePlayer:' + username).getBytes('UTF-8')
        ).toString()

        args '--username', username
        args '--uuid', offlineUuid
        args '--accessToken', '0'
        args '--userType', 'legacy'
    }
}

tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    useXVFB = true
    runDir = file('run')

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }

    // Use the production-remapped bot JAR.
    mods.from(tasks.named('remapJar'))

    // Load the actual installed client mods without the development remapper.
    mods.from(fileTree('mods') {
        include '*.jar'
    })

    def cfg = new groovy.json.JsonSlurper().parse(file('bot-settings.json'))
    def username = cfg.account.username.toString()

    if (username.length() > 16 || username.isEmpty()) {
        throw new GradleException('Invalid account.username')
    }

    def offlineUuid = UUID.nameUUIDFromBytes(
        ('OfflinePlayer:' + username).getBytes('UTF-8')
    ).toString()

    programArgs.addAll([
        '--username', username,
        '--uuid', offlineUuid,
        '--accessToken', '0',
        '--userType', 'legacy'
    ])
}
